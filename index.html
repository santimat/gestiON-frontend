<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GestiON es tu aliado de confianza a la hora de realizar el control de stock y controlar los ingresos de tu negocio."
    />
    <title>GestiON</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello
      // del tema claro. La clave debe coincidir con
      // src/shared/theme/themeColorSchemeManager.ts
      (function () {
        try {
          var stored = localStorage.getItem("gestiON-theme");
          var scheme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute(
            "data-mantine-color-scheme",
            scheme,
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
